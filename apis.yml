name: roli
description: >-
  ROLI (Luminary ROLI Ltd.) is a British music-technology company known for
  expressive electronic instruments — the Seaboard, LUMI Keys keyboards, and the
  modular BLOCKS system — together with companion software such as ROLI
  Dashboard, ROLI Connect, Equator, and ROLI Learn. Its instruments pioneer MPE
  (MIDI Polyphonic Expression) for per-note pitch, timbre, and dynamics control.
  For developers, ROLI publishes first-party SDKs under the github.com/weareroli
  organization — the C++ BLOCKS-SDK and roli_blocks_basics for building
  applications that talk to BLOCKS hardware, and the archived mpejs library for
  MPE MIDI in the browser. ROLI is backed by Balderton Capital and Index
  Ventures. This profile was added to the API Evangelist network as a portfolio
  lead and enriched with real developer, SDK, and domain-security artifacts.
